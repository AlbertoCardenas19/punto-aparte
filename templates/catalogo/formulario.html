{% extends "base.html" %}

{% block title %}{{ titulo }} | Punto Aparte{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card">
            <div class="card-body p-4">
                <h1 class="h3 fw-bold mb-4">{{ titulo }}</h1>

                <form method="post">
                    {% csrf_token %}
                    {% if token_escaneo %}
                    <input type="hidden" name="desde_escaneo" value="{{ token_escaneo }}">
                    {% endif %}
                    {{ form.as_p }}

                    <div class="d-flex flex-wrap gap-2 pa-form-acciones">
                        <button class="btn btn-pa" type="submit">Guardar</button>
                        <a class="btn btn-outline-secondary" href="{% if url_cancelar_directa %}{{ url_cancelar_directa }}{% else %}{% url url_cancelar %}{% endif %}">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
