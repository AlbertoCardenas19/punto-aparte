{% extends "base.html" %}
{% block title %}Crear contraseña nueva | Punto Aparte{% endblock %}
{% block content %}
<section class="card mx-auto" style="max-width: 42rem"><div class="card-body">
    <h1 class="h3">Crea tu contraseña nueva</h1>
    <p>Debes reemplazar la contraseña temporal antes de continuar.</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-pa" type="submit">Guardar contraseña y continuar</button></form>
</div></section>
{% endblock %}
