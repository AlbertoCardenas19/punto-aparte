{% extends "base.html" %}

{% block title %}Iniciar sesión | Punto Aparte{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h1 class="h3 fw-bold">Punto Aparte</h1>
                    <p class="text-secondary mb-0">Inicia sesión para continuar</p>
                </div>

                {% if form.errors %}
                <div class="alert alert-danger" role="alert">
                    El nombre de usuario o la contraseña no son correctos.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Nombre de usuario</label>
                        <input id="id_username" class="form-control form-control-lg" type="text" name="username"
                            autocomplete="username" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <input id="id_password" class="form-control form-control-lg" type="password" name="password"
                            autocomplete="current-password" required>
                    </div>

                    <input type="hidden" name="next" value="{{ next }}">

                    <button class="btn btn-pa btn-lg w-100" type="submit">
                        Ingresar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
